<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenKern — governed execution for AI agents">
  <rect width="1280" height="640" fill="#0C0F0E"/>
  <!-- faint boundary grid, structural not decorative -->
  <g stroke="#1A1F1C" stroke-width="1">
    <path d="M 0 160 H 1280 M 0 480 H 1280 M 160 0 V 640 M 1120 0 V 640"/>
  </g>
  <!-- lockup -->
  <g transform="translate(160,232)">
    <g transform="scale(2.2)" fill="none" stroke="#E9EDEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 16 L 14 16 L 14 48 L 22 48"/>
      <path d="M 42 16 L 50 16 L 50 48 L 42 48"/>
      <path d="M 25 25 L 34 32 L 25 39"/>
    </g>
    <rect x="83.6" y="57.2" width="15.4" height="26.4" rx="2.2" fill="#E9EDEA"/>
    <text x="164" y="92" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="64" fill="#E9EDEA"><tspan font-weight="400">open</tspan><tspan font-weight="700">kern</tspan></text>
  </g>
  <!-- tagline -->
  <text x="160" y="420" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="28" fill="#A8B3AD">governed execution for AI agents</text>
  <!-- state strip: the product in one line -->
  <g font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="20" font-weight="700">
    <text x="160" y="520" fill="#57B87B">[+] ALLOW</text>
    <text x="340" y="520" fill="#D9A03F">[?] ASK</text>
    <text x="480" y="520" fill="#DE685E">[-] DENY</text>
    <text x="640" y="520" fill="#57B87B">[=] VERIFIED</text>
    <text x="880" y="520" fill="#E9EDEA">evidence &gt; claims</text>
  </g>
</svg>
